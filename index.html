<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>大西正浩Web化学 | 難関大合格のためのWeb授業</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        --color-ink: #0a0a0a;
        --color-paper: #f5f5f0;
        --color-gold: #cfaa7d;
        --cursor-size: 20px;
      }
      body {
        font-family: 'Shippori Mincho', serif;
        background-color: var(--color-ink);
        color: var(--color-paper);
        overflow-x: hidden;
        cursor: none; /* Hide default cursor */
      }
      .font-sans {
        font-family: 'Noto Sans JP', sans-serif;
      }
      .font-display {
        font-family: 'Cormorant Garamond', serif;
      }
      .vertical-text {
        writing-mode: vertical-rl;
        text-orientation: upright;
        font-feature-settings: "palt";
      }
      
      /* Custom Cursor */
      .custom-cursor {
        position: fixed;
        top: 0;
        left: 0;
        width: var(--cursor-size);
        height: var(--cursor-size);
        border: 1px solid var(--color-paper);
        border-radius: 50%;
        pointer-events: none;
        z-index: 9999;
        transform: translate(-50%, -50%);
        transition: width 0.3s, height 0.3s, background-color 0.3s, border-color 0.3s;
        mix-blend-mode: difference;
      }
      .custom-cursor.hovered {
        width: 50px;
        height: 50px;
        background-color: var(--color-paper);
        border-color: transparent;
        opacity: 0.5;
      }
      
      /* Noise Overlay */
      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 50;
        opacity: 0.07;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }

      /* Utilities */
      .text-outline {
        -webkit-text-stroke: 1px rgba(255, 255, 255, 0.2);
        color: transparent;
      }
      
      ::selection {
        background-color: var(--color-gold);
        color: var(--color-ink);
      }
      
      html {
        scroll-behavior: smooth;
      }
    </style>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              'ink': '#0a0a0a',
              'paper': '#f5f5f0',
              'gold': '#cfaa7d',
              'gold-light': '#e6d5b8',
              'charcoal': '#1a1a1a',
            },
            fontFamily: {
              sans: ['Noto Sans JP', 'sans-serif'],
              serif: ['Shippori Mincho', 'serif'],
              display: ['Cormorant Garamond', 'serif'],
            },
            letterSpacing: {
              tighter: '-0.05em',
              widest: '.25em',
              ultra: '.4em',
            },
            animation: {
              'float': 'float 6s ease-in-out infinite',
              'spin-slow': 'spin 15s linear infinite',
            },
            keyframes: {
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-20px)' },
              },
              fadeIn: {
                '0%': { opacity: '0' },
                '100%': { opacity: '1' },
              },
              slideUp: {
                '0%': { transform: 'translateY(20px)', opacity: '0' },
                '100%': { transform: 'translateY(0)', opacity: '1' },
              },
              slideRight: {
                '0%': { transform: 'translateX(-20px)', opacity: '0' },
                '100%': { transform: 'translateX(0)', opacity: '1' },
              }
            }
          }
        }
      }
    </script>
    <script type="importmap">
    {
      "imports": {
        "react": "https://esm.sh/react@^19.2.3",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
        "react/": "https://esm.sh/react@^19.2.3/",
        "lucide-react": "https://esm.sh/lucide-react@^0.563.0"
      }
    }
    </script>
  <link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
